# 后端 API：Deployment + Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devmind-backend
  namespace: devmind
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devmind-backend
  template:
    metadata:
      labels:
        app: devmind-backend
    spec:
      containers:
        - name: api
          image: devmind/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: devmind-config
            - secretRef:
                name: devmind-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: devmind-backend
  namespace: devmind
spec:
  selector:
    app: devmind-backend
  ports:
    - port: 8000
      targetPort: 8000
