# 仅供数据库迁移 Job 使用的 Secret 结构示例，不可直接应用。
# 由企业密钥控制器创建 devmind-migration-secret；API/worker 不得引用此 Secret。
# 该账号可执行 Alembic DDL；使用完由 Job 退出，不要把它合并进 devmind-secret。
apiVersion: v1
kind: Secret
metadata:
  name: devmind-migration-secret
  namespace: devmind
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://REPLACE_MIGRATOR:REPLACE_PASSWORD@REPLACE_HOST:5432/devmind?sslmode=verify-full"
