# 敏感配置结构示例。所有 REPLACE_* 都必须替换；此文件不可直接用于生产。
# 推荐由 External Secrets/Sealed Secrets 等从企业密钥系统同步，而不是提交 secret.yaml。
# 查看所需键：kubectl -n devmind get secret devmind-secret；API/worker 只应得到运行时 DML 凭据。
apiVersion: v1
kind: Secret
metadata:
  name: devmind-secret
  namespace: devmind
type: Opaque
stringData:
  # 普通 key、管理 key、前端 nginx 服务 key 必须分别生成，长度至少 32 字符。
  # DEVMIND_FRONTEND_API_KEY 的值也必须包含在 DEVMIND_API_KEYS 列表中。
  DEVMIND_API_KEYS: "REPLACE_WITH_COMMA_SEPARATED_MACHINE_AND_FRONTEND_KEYS"
  DEVMIND_ADMIN_API_KEYS: "REPLACE_WITH_COMMA_SEPARATED_ADMIN_KEYS"
  DEVMIND_FRONTEND_API_KEY: "REPLACE_WITH_FRONTEND_SERVICE_KEY"
  DATABASE_URL: "postgresql+psycopg://REPLACE_USER:REPLACE_PASSWORD@REPLACE_HOST:5432/devmind?sslmode=verify-full"
  REDIS_URL: "rediss://:REPLACE_PASSWORD@REPLACE_HOST:6379/0"
  NEO4J_PASSWORD: "REPLACE_WITH_NEO4J_PASSWORD"
  DEEPSEEK_API_KEY: "REPLACE_FOR_DEFAULT_LLM_MODEL"
  DASHSCOPE_API_KEY: "REPLACE_FOR_DEFAULT_EMBEDDING_MODEL"
  ZHIPUAI_API_KEY: ""
  OPENAI_API_KEY: ""
  GITHUB_TOKEN: "REPLACE_WITH_MINIMUM_SCOPE_GITHUB_TOKEN"
  GITHUB_WEBHOOK_SECRET: "REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS"
  ALERT_WEBHOOK_SECRET: "REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS"
  IM_WEBHOOK_URL: "https://REPLACE_WITH_IM_WEBHOOK"
  # 可选集成必须整组配置；不用时保持整组为空，不能保留占位字符串。
  ATLASSIAN_BASE_URL: ""
  ATLASSIAN_EMAIL: ""
  ATLASSIAN_API_TOKEN: ""
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""
