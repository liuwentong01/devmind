# API/worker/frontend 的通用 HPA 基线；依赖 Metrics Server 和各容器的 resources.requests。
# 使用：kubectl apply -f deploy/k8s/autoscaling.yaml && kubectl -n devmind get hpa
# 阈值必须由压测校准；worker 生产扩缩容应优先采用 Redis 队列深度/KEDA。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devmind-backend
  namespace: devmind
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devmind-backend
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devmind-worker
  namespace: devmind
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devmind-worker
  minReplicas: 2
  maxReplicas: 5
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devmind-frontend
  namespace: devmind
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devmind-frontend
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
