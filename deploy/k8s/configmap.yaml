# 非敏感配置（敏感项放 Secret）
apiVersion: v1
kind: ConfigMap
metadata:
  name: devmind-config
  namespace: devmind
data:
  APP_ENV: "prod"
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: "https://devmind.example.com"
  LLM_DEFAULT_MODEL: "deepseek/deepseek-chat"
  EMBEDDING_MODEL: "dashscope/text-embedding-v3"
  EMBEDDING_DIM: "1024"
  DATABASE_URL: "postgresql+psycopg://devmind:devmind@postgres:5432/devmind"
  REDIS_URL: "redis://redis:6379/0"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  RCA_MAX_ITERATIONS: "2"
  RCA_CONFIDENCE_THRESHOLD: "0.75"
