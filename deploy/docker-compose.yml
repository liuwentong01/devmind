# DevMind 本地依赖编排（P0）
# 仅起基础设施：PostgreSQL(pgvector) + Redis + Langfuse。
# 后端 / 前端建议本地直接跑（热重载方便），后续阶段再容器化。
#
# 启动：docker compose -f deploy/docker-compose.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devmind-postgres
    environment:
      POSTGRES_USER: devmind
      POSTGRES_PASSWORD: devmind
      POSTGRES_DB: devmind
    ports:
      - "5432:5432"
    volumes:
      - devmind_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devmind-redis
    ports:
      - "6379:6379"
    volumes:
      - devmind_redis:/data

  # ===== Langfuse 可观测（可选，按需启用）=====
  # Langfuse 自带独立 postgres，避免与业务库混用
  langfuse-db:
    image: postgres:16-alpine
    container_name: devmind-langfuse-db
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - devmind_langfuse_pg:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:2
    container_name: devmind-langfuse
    depends_on:
      - langfuse-db
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-secret-change-me
      SALT: dev-salt-change-me
      TELEMETRY_ENABLED: "false"

volumes:
  devmind_pg:
  devmind_redis:
  devmind_langfuse_pg:
