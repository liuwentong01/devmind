# DevMind 本地依赖编排（禁止用于生产）
# 仅起基础设施：PostgreSQL(pgvector) + Redis + Neo4j + 可选 Langfuse。
# 后端 / 前端建议本地直接跑（热重载方便），后续阶段再容器化。
#
# 启动：docker compose -f deploy/docker-compose.yml up -d
# 状态：docker compose -f deploy/docker-compose.yml ps
# 停止但保留数据：docker compose -f deploy/docker-compose.yml down
# 删除 volume 会丢失本地数据，只有明确要重建环境时才执行 down -v。

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devmind-postgres
    environment:
      POSTGRES_USER: devmind
      POSTGRES_PASSWORD: devmind
      POSTGRES_DB: devmind
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - devmind_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmind -d devmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devmind-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - devmind_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Neo4j 代码图谱（P5）=====
  neo4j:
    image: neo4j:5
    container_name: devmind-neo4j
    environment:
      NEO4J_AUTH: neo4j/devmind-neo4j
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "127.0.0.1:7474:7474"   # Browser UI
      - "127.0.0.1:7687:7687"   # Bolt
    volumes:
      - devmind_neo4j:/data

  # ===== Langfuse 可观测（可选，按需启用）=====
  # Langfuse 自带独立 postgres，避免与业务库混用
  langfuse-db:
    image: postgres:16-alpine
    container_name: devmind-langfuse-db
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - devmind_langfuse_pg:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:2
    container_name: devmind-langfuse
    depends_on:
      - langfuse-db
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-secret-change-me
      SALT: dev-salt-change-me
      TELEMETRY_ENABLED: "false"

volumes:
  devmind_pg:
  devmind_redis:
  devmind_neo4j:
  devmind_langfuse_pg:
