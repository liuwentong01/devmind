[project]
name = "devmind-backend"
version = "0.1.0"
description = "研发效能智能体平台 DevMind - 后端 (P0 内核)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.3",
    "structlog>=24.4.0",
    # Agent 编排与 LLM
    "langgraph>=0.2.40",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-litellm>=0.2.0",
    "litellm>=1.51.0",
    # 数据库 + 向量检索 (P1 RAG)
    "sqlalchemy[asyncio]>=2.0.35",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.5",
    # 异步任务队列 (P2 事件驱动)
    "arq>=0.26.0",
    # 代码理解 (P5：AST 解析 + 图数据库)
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack>=0.3.0",
    "neo4j>=5.25.0",
    # 可观测
    "langfuse>=2.53.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
