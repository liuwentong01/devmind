# Python 项目元数据与“允许版本区间”。生产安装不直接解析这里，而使用 requirements.lock。
# 开发安装：pip install -e .；更新锁文件时用 pip-compile 并提交两份带 hash 的 lock。
[project]
name = "devmind-backend"
version = "0.1.0"
description = "研发效能智能体平台 DevMind - 后端 (P0 内核)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "sse-starlette>=2.1.3,<4.0.0",
    "structlog>=24.4.0,<27.0.0",
    # Agent 编排与 LLM
    "langgraph>=0.2.40,<2.0.0",
    "langchain>=0.3.0,<2.0.0",
    "langchain-core>=0.3.0,<2.0.0",
    "langchain-community>=0.3.0,<1.0.0",
    "langchain-text-splitters>=0.3.0,<2.0.0",
    "langchain-litellm>=0.2.0,<1.0.0",
    "litellm>=1.51.0,<2.0.0",
    # 数据库 + 向量检索 (P1 RAG)
    "sqlalchemy[asyncio]>=2.0.35,<3.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pgvector>=0.3.5,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
    # 异步任务队列 (P2 事件驱动)
    "arq>=0.26.0,<1.0.0",
    # 代码理解 (P5：AST 解析 + 图数据库)
    "tree-sitter>=0.23.0,<1.0.0",
    # 0.x wheel bundles grammars for offline/runtime-safe parsing. 1.x downloads parsers
    # on first use, which is incompatible with our non-root, network-isolated runtime.
    "tree-sitter-language-pack>=0.3.0,<1.0.0",
    "neo4j>=5.25.0,<7.0.0",
    # 可观测
    "langfuse>=3.0.0,<5.0.0",
]

[project.optional-dependencies]
# CI/开发工具单独分组，避免进入精简生产镜像。
dev = [
    "pip-audit>=2.10.1,<3.0.0",
    "ruff>=0.7.0,<1.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
]

[tool.ruff]
# Ruff 同时负责 lint 和格式，CI 对 app/tests/alembic 三个目录执行。
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
