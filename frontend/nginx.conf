# 前端运行时 nginx：托管 SPA、按资源类型设置缓存，并把 /api 同源代理到后端。
# Docker 镜像会对 ${DEVMIND_API_KEY} 做受限 envsubst；不要手工把真实 Key 写进本文件。
# 本地验证：docker run --rm -p 8080:8080 -e DEVMIND_API_KEY=test... <frontend-image>
map $uri $devmind_cache_control {
    default "no-cache, no-store, must-revalidate";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/api/ "";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 10m;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control $devmind_cache_control always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端 service（K8s 中 backend 的 service 名）
    location /api/ {
        proxy_pass http://devmind-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 运行时由 Secret 注入；envsubst 过滤器只替换该变量，不碰 nginx 的 $uri 等变量。
        proxy_set_header X-API-Key "${DEVMIND_API_KEY}";
        proxy_connect_timeout 5s;
        proxy_send_timeout 600s;
        # SSE 流式：关闭缓冲
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
