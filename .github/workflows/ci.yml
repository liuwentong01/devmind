# DevMind 持续集成总入口。四个 Job 依次保护源码质量、前端契约、真实迁移和交付制品。
# 本地复现命令见 docs/源码注释与使用示例索引.md；push main 或 Pull Request 会触发。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Use the model-cost map bundled in the locked LiteLLM package; CI must not fetch mutable data.
  LITELLM_LOCAL_MODEL_COST_MAP: "True"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 快速、纯 Python 的质量门：锁依赖、静态检查、漏洞审计和单元测试。
  backend:
    name: Backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.lock
      - name: Lint
        run: ruff check app tests alembic
      - name: Formatting
        run: ruff format --check app tests alembic
      - name: Dependency integrity
        run: python -m pip check
      # langchain-litellm 0.7.0 pins cryptography<49, while the three advisories
      # below require cryptography 49/50. Keep the exception narrow so every new
      # advisory still fails CI. Remove it when upstream widens the constraint;
      # the explicit deadline prevents this temporary exception becoming permanent.
      - name: Production dependency audit
        run: |
          python -c "from datetime import date, datetime, timezone; assert datetime.now(timezone.utc).date() <= date(2026, 9, 15), 'cryptography audit exceptions expired: upgrade langchain-litellm and remove the ignores'"
          pip-audit \
            --requirement requirements.lock \
            --require-hashes \
            --no-deps \
            --disable-pip \
            --vulnerability-service pypi \
            --strict \
            --progress-spinner off \
            --ignore-vuln PYSEC-2026-3552 \
            --ignore-vuln PYSEC-2026-3553 \
            --ignore-vuln PYSEC-2026-3554
      - name: Tests
        run: pytest -q

  # 浏览器代码门：锁安装、lint、协议测试、类型/生产构建和完整依赖树审计。
  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Full dependency audit
        run: npm audit --audit-level=moderate

  # 用真实 pgvector PostgreSQL 从空库跑 Alembic，防止单元测试遗漏迁移/启动问题。
  integration:
    name: Migration and startup smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: devmind_ci
          POSTGRES_PASSWORD: devmind_ci_password
          POSTGRES_DB: devmind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devmind_ci -d devmind_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://devmind_ci:devmind_ci_password@127.0.0.1:5432/devmind_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      COST_TRACKING_BACKEND: redis
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.lock
      - name: Upgrade an empty pgvector database
        run: alembic upgrade head
      - name: Verify migration head and application import
        run: |
          alembic current | grep 20260815_0002
          python -c "from app.main import app; assert app.title"

  # 只有前三个 Job 成功后才验证 Compose/K8s 模型并实际构建生产镜像。
  delivery:
    name: Delivery artifacts
    needs: [backend, frontend, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEVMIND_BACKEND_IMAGE: devmind/backend:ci
      DEVMIND_FRONTEND_IMAGE: devmind/frontend:ci
      DEVMIND_HOSTNAME: devmind.example.com
      DEVMIND_WEBHOOK_HOSTNAME: devmind-webhooks.example.com
      DEVMIND_API_KEYS: ci-ordinary-key-00000000000000000000000000000001
      DEVMIND_ADMIN_API_KEYS: ci-admin-key-000000000000000000000000000000002
      DEVMIND_FRONTEND_API_KEY: ci-ordinary-key-00000000000000000000000000000001
      GITHUB_WEBHOOK_SECRET: ci-github-webhook-000000000000000000000000000001
      ALERT_WEBHOOK_SECRET: ci-alert-webhook-0000000000000000000000000000002
      GITHUB_TOKEN: ci-github-token
      IM_WEBHOOK_URL: https://im.example.com/hooks/ci
      DEEPSEEK_API_KEY: ci-deepseek-key
      DASHSCOPE_API_KEY: ci-dashscope-key
      DATABASE_URL: postgresql+psycopg://ci:ci-password@db.example.com:5432/devmind?sslmode=verify-full
      MIGRATION_DATABASE_URL: postgresql+psycopg://ci-migrator:ci-migration-password@db.example.com:5432/devmind?sslmode=verify-full
      REDIS_URL: rediss://:ci-password@redis.example.com:6379/0
      NEO4J_URI: neo4j+s://neo4j.example.com:7687
      NEO4J_USER: ci
      NEO4J_PASSWORD: ci-password-not-a-production-secret
      CODE_INDEX_HOST_PATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.13"
      - name: Validate YAML syntax
        run: |
          python -m pip install yamllint==1.37.1
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' deploy/k8s .github
      - name: Validate Compose models
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.prod.yml config --quiet
      - name: Validate Kubernetes schemas
        run: >-
          docker run --rm -v "${PWD}:/work:ro"
          ghcr.io/yannh/kubeconform:v0.7.0-alpine
          -summary -strict -ignore-missing-schemas /work/deploy/k8s
      - name: Build production images
        run: |
          docker build --tag devmind/backend:ci backend
          docker build --tag devmind/frontend:ci frontend
